name: Build sailfishos Images

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Sailfish OS release to build"
        default: "5.1.0.11"
      sdk_image:
        description: "Platform SDK container image (must match or exceed the release)"
        default: "coderus/sailfishos-platform-sdk-base:5.1.0.11"
      waydroid:
        description: "Also build a Waydroid (Android app support) image"
        type: boolean
        default: false

env:
  # Current stable Sailfish OS release ("Pispala", released to all 2026-06-16).
  SFOS_RELEASE: ${{ github.event.inputs.release || '5.1.0.11' }}
  SDK_IMAGE: ${{ github.event.inputs.sdk_image || 'coderus/sailfishos-platform-sdk-base:5.1.0.11' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [a5y17lte, a7y17lte]
        waydroid: ${{ fromJSON(github.event.inputs.waydroid == 'true' && '["0","1"]' || '["0"]') }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install needed packages
      run: |
        sudo apt-get update && sudo apt-get install -y qemu-user-static
        echo "NOW=$(date +'%Y.%m.%d')" >> "$GITHUB_ENV"

    - name: Check adaptation repo exists for this release
      run: |
        base="https://exynos7880-linux.github.io/repo/${SFOS_RELEASE}"
        url="$base/${{ matrix.device }}/repodata/repomd.xml"
        if ! curl -sfI "$url" >/dev/null; then
          echo "::error::No ${{ matrix.device }} adaptation for ${SFOS_RELEASE} at $url. See UPGRADING.md."
          exit 1
        fi
        if [ "${{ matrix.waydroid }}" = "1" ] && ! curl -sfI "$base/waydroid/repodata/repomd.xml" >/dev/null; then
          echo "::error::No Waydroid repo for ${SFOS_RELEASE} at $base/waydroid/. See UPGRADING.md."
          exit 1
        fi

    - name: Build Sailfish OS image in Platform SDK
      run: |
        docker run --rm --privileged \
          -e RELEASE="${SFOS_RELEASE}" \
          -e WAYDROID="${{ matrix.waydroid }}" \
          -v "${{ github.workspace }}:/build" \
          "${SDK_IMAGE}" \
          bash -c 'set -x; cd /build && ./run-mic.sh ${{ matrix.device }} && sudo mv sfe-*/*.zip .'

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NOW }}-${{ matrix.device }}-${{ env.SFOS_RELEASE }}${{ matrix.waydroid == '1' && '-waydroid' || '' }}
        name: ${{ env.NOW }}-${{ matrix.device }} (Sailfish OS ${{ env.SFOS_RELEASE }}${{ matrix.waydroid == '1' && ' + Waydroid' || '' }})
        prerelease: true
        files: sailfishos*.zip
